name: Ingesta de tiendas

on:
  schedule:
    - cron: '17 6 * * *'   # 06:17 UTC = 01:17 en Ecuador, una vez al día (ADR 0008)
  workflow_dispatch:
    inputs:
      tienda:
        description: 'Solo esta tienda (vacío = las activas y las sin permiso, que se vuelven a revisar)'
        required: false
      limite_paginas:
        description: 'Cortar tras N páginas por tienda (vacío = corrida completa)'
        required: false

concurrency: ingesta   # nunca dos corridas a la vez

jobs:
  corrida:
    runs-on: ubuntu-latest
    # Las tiendas corren en paralelo; la más larga es una fuente sitemap con su presupuesto completo
    # (2500 páginas a 1 por segundo: unos 42 minutos), o Kywi (unos 11 minutos).
    timeout-minutes: 90
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      TIENDA: ${{ inputs.tienda }}
      LIMITE_PAGINAS: ${{ inputs.limite_paginas }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run ingesta --workspace packages/ingesta
      # Falla (y GitHub avisa por correo) si una tienda lleva dos corridas malas, está desactualizada o la base pasa de 400 MB.
      - name: Avisos de operación
        if: always()
        run: node scripts/avisos-operacion.mjs
